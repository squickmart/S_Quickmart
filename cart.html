<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="S2.PNG" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart — S_Quick Mart</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <style>
      .cart-layout {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 28px;
        padding: 32px 0 60px;
        align-items: flex-start;
      }
      @media (max-width: 980px) {
        .cart-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="timing-bar" id="timingBar"></div>

    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">
          <span class="mark"
            ><img
              src="SLOGO.png"
              onerror="
                this.style.display = 'none';
                this.parentNode.textContent = '🛒';
              "
          /></span>
          <div>
            <div>Quick Mart</div>
            <div class="logo-sub">Parbhani's Own Store</div>
          </div>
        </a>
        <a href="profile.html?tab=addresses" class="location-pill">
          <span class="loc-ic">📍</span>
          <div class="loc-text">
            <div class="loc-line1" id="locLine1">Select delivery area</div>
            <div class="loc-line2">Parbhani, Maharashtra</div>
          </div>
          <span class="loc-change">Change</span>
        </a>
        <div class="header-actions" style="margin-left: auto">
          <a href="products.html" class="icon-btn" aria-label="Categories">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
          </a>
          <a href="login.html" class="icon-btn" aria-label="Account"
            >👤 <span class="txt" data-user-label>Login</span></a
          >
          <a
            href="cart.html"
            class="header-cart"
            style="background: var(--green-deep)"
          >
            <span style="position: relative"
              >🛒<span
                class="badge"
                data-cart-badge
                style="position: absolute; top: -10px; right: -12px"
                >0</span
              ></span
            >
            <span class="label">Cart</span
            ><span class="amt" data-cart-amount>₹0</span>
          </a>
        </div>
      </div>
    </header>

    <div class="container">
      <h1 style="font-size: 26px; padding-top: 24px">Your Cart</h1>
      <div id="cartRoot"></div>
    </div>

    <nav class="mobile-nav">
      <a href="index.html"
        ><svg viewBox="0 0 24 24">
          <path d="M3 11l9-8 9 8" />
          <path d="M5 10v10h14V10" /></svg
        >Home</a
      >
      <a href="products.html"
        ><svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" /></svg
        >Categories</a
      >
      <a href="cart.html" class="active"
        ><svg viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path
            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
          /></svg
        >Cart</a
      >
      <a href="orders.html"
        ><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18" /></svg
        >Orders</a
      >
      <a href="login.html"
        ><svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6" /></svg
        >Account</a
      >
    </nav>

    <script src="js/firebase.js"></script>
    <script src="js/core.js"></script>
    <script>
      const FREE_DELIVERY_ABOVE = 399;
      const DEFAULT_DELIVERY_FEE = 23;

      function sqmDeliveryFee(subtotal) {
        if (subtotal > FREE_DELIVERY_ABOVE) return 0;
        const u = UserStore.get();
        const areas = window._ynAreas || [];
        const areaData = areas.find((a) => a.name === u.area);
        return areaData && areaData.deliveryCharge !== undefined
          ? areaData.deliveryCharge
          : DEFAULT_DELIVERY_FEE;
      }

      function renderCart() {
        const root = document.getElementById("cartRoot");
        const items = CartStore.items();

        if (!items.length) {
          root.innerHTML = `
        <div class="empty-cart reveal in">
          <div class="ic">🛒</div>
          <h3 style="font-size:20px;margin-bottom:8px;">Your cart is empty</h3>
          <p class="text-muted" style="margin-bottom:22px;">Add fresh groceries and daily essentials to get started.</p>
          <a href="products.html" class="btn btn-primary">Start Shopping</a>
        </div>`;
          return;
        }

        const subtotal = CartStore.subtotal();
        const mrpTotal = CartStore.mrpTotal();
        const itemDiscount = mrpTotal - subtotal;
        const itemCount = CartStore.count();
        const delivery = sqmDeliveryFee(subtotal);
        const total = subtotal + delivery;

        root.innerHTML = `
      <div class="cart-layout">
        <div class="cart-card">
          <div class="cart-head">
            <span style="font-weight:700;font-size:14px;">${itemCount} item${itemCount !== 1 ? "s" : ""} in cart</span>
            <button class="section-link" style="color:var(--red);" id="clearCartBtn">Clear cart</button>
          </div>
          <div id="cartItems">
            ${items
              .map(
                (i) => `
              <div class="cart-item" data-key="${i.key}">
                <div class="emoji-box">${i.img ? `<img src="${i.img}" onerror="this.style.display='none';this.parentNode.textContent='${i.emoji || "🛒"}'">` : i.emoji || "🛒"}</div>
                <div class="ci-info">
                  <h4>${i.name}</h4>
                  <span>${i.unit || ""}</span>
                  <div class="mt-8" style="display:flex;align-items:center;gap:10px;">
                    <div class="qty-stepper" style="width:auto;">
                      <button onclick="CartStore.setQty('${i.key}', CartStore.qtyOfKey('${i.key}')-1)">−</button>
                      <span class="n" style="padding:0 6px;">${i.qty}</span>
                      <button onclick="CartStore.setQty('${i.key}', CartStore.qtyOfKey('${i.key}')+1)">+</button>
                    </div>
                    <button class="ci-remove" onclick="CartStore.remove('${i.key}')">Remove</button>
                  </div>
                </div>
                <div class="ci-price">${sqmCurrency(i.price * i.qty)}</div>
              </div>
            `,
              )
              .join("")}
          </div>
        </div>

        <div>
          <div class="cart-card" style="padding:20px 22px;">
            <h4 style="font-size:15px;margin-bottom:12px;">Order Summary</h4>
            <div class="summary-row"><span>MRP Total</span><span>${sqmCurrency(mrpTotal)}</span></div>
            ${itemDiscount > 0 ? `<div class="summary-row"><span>Item Discount</span><span style="color:var(--green);">−${sqmCurrency(itemDiscount)}</span></div>` : ""}
            <div class="summary-row"><span>Delivery Fee</span><span>${delivery === 0 ? "FREE 🎉" : sqmCurrency(delivery)}</span></div>
            <div class="summary-row total"><span>To Pay</span><span>${sqmCurrency(total)}</span></div>
            ${delivery > 0 ? `<p class="text-muted" style="font-size:11.5px;margin-top:6px;">Add ${sqmCurrency(FREE_DELIVERY_ABOVE + 1 - subtotal)} more for free delivery</p>` : ""}
            <a href="checkout.html" class="btn btn-primary btn-block mt-16">Proceed to Checkout</a>
          </div>
        </div>
      </div>
    `;
      }

      document
        .getElementById("clearCartBtn")
        ?.addEventListener("click", () => CartStore.clear());
      document.addEventListener("click", (e) => {
        if (e.target.id === "clearCartBtn") CartStore.clear();
      });
      document.addEventListener("DOMContentLoaded", renderCart);
      document.addEventListener("sqm:cart-changed", renderCart);
      window.sqmApplyStoreStatus = sqmApplyStoreStatus;
    </script>
  </body>
</html>
