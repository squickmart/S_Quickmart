<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="S2.PNG" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop All Products — S_Quick Mart</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <style>
      .shop-layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 32px;
        align-items: flex-start;
        padding: 28px 0 60px;
      }
      .filter-panel {
        background: var(--paper-raised);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 20px;
        position: sticky;
        top: calc(var(--header-h) + 60px);
      }
      .filter-group {
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .filter-group:last-child {
        border-bottom: none;
      }
      .filter-group h5 {
        font-size: 13px;
        margin-bottom: 12px;
      }
      .filter-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--ink-soft);
        padding: 6px 0;
        cursor: pointer;
      }
      .filter-row.active-cat {
        color: var(--green-deep);
        font-weight: 700;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
        gap: 16px;
        flex-wrap: wrap;
      }
      .result-count {
        font-size: 13.5px;
        color: var(--ink-soft);
      }
      .filter-fab {
        display: none;
      }
      @media (max-width: 980px) {
        .shop-layout {
          grid-template-columns: 1fr;
        }
        .filter-panel {
          display: none;
        }
        .filter-fab {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div class="timing-bar" id="timingBar"></div>

    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">
          <span class="mark"
            ><img
              src="SLOGO.png"
              onerror="
                this.style.display = 'none';
                this.parentNode.textContent = '🛒';
              "
          /></span>
          <div>
            <div>S_Quick Mart</div>
            <div class="logo-sub">Parbhani's Own Store</div>
          </div>
        </a>
        <div class="search-shell" id="searchShell">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder='Search "milk", "grocery", "soap"...'
            autocomplete="off"
          />
          <div class="search-suggest" id="searchDrop"></div>
        </div>
        <div class="header-actions">
          <a href="products.html" class="icon-btn" aria-label="Categories">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
          </a>
          <a
            href="profile.html?tab=wishlist"
            class="icon-btn"
            aria-label="Wishlist"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M12 21s-7.5-4.9-10-9.3C.4 8 2 4.5 5.6 4c2-.3 3.8.7 4.9 2.3C11.6 4.7 13.4 3.7 15.4 4c3.6.5 5.2 4 3.6 7.7C19 16.1 12 21 12 21z"
              />
            </svg>
            <span
              class="badge"
              data-wish-badge
              style="position: absolute; top: 0; right: 0"
              >0</span
            >
          </a>
          <a href="login.html" class="icon-btn" aria-label="Account"
            >👤 <span class="txt" data-user-label>Login</span></a
          >
          <a href="cart.html" class="header-cart">
            <span style="position: relative"
              >🛒<span
                class="badge"
                data-cart-badge
                style="position: absolute; top: -10px; right: -12px"
                >0</span
              ></span
            >
            <span class="label">Cart</span
            ><span class="amt" data-cart-amount>₹0</span>
          </a>
        </div>
      </div>
      <nav class="nav-row"><div class="container" id="navRow"></div></nav>
    </header>

    <div class="container">
      <div class="shop-layout">
        <aside class="filter-panel" id="filterPanel">
          <h4 style="font-size: 16px; margin-bottom: 4px">Categories</h4>
          <div class="filter-group"><div id="catFilters"></div></div>
        </aside>

        <main>
          <div class="subcat-pills" id="subcatPills"></div>
          <div class="prod-grid" id="productGrid">
            <p
              class="text-muted"
              style="grid-column: 1/-1; text-align: center; padding: 40px"
            >
              Loading products…
            </p>
          </div>
        </main>
      </div>
    </div>

    <button
      class="btn btn-primary filter-fab"
      id="filterFab"
      style="
        position: fixed;
        bottom: 78px;
        right: 16px;
        z-index: 150;
        border-radius: 999px;
        box-shadow: var(--shadow-lg);
      "
    >
      Categories
    </button>
    <div class="overlay" id="filterOverlay">
      <div
        class="drawer"
        id="filterDrawer"
        style="
          top: auto;
          bottom: 0;
          height: auto;
          max-height: 80vh;
          border-radius: var(--r-lg) var(--r-lg) 0 0;
          transform: translateY(100%);
        "
      >
        <div
          style="
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <h4 style="font-size: 16px">Categories</h4>
          <button id="closeFilter" style="font-size: 20px">✕</button>
        </div>
        <div
          style="padding: 16px 20px; overflow-y: auto"
          id="mobileFilterHost"
        ></div>
      </div>
    </div>

    <nav class="mobile-nav">
      <a href="index.html"
        ><svg viewBox="0 0 24 24">
          <path d="M3 11l9-8 9 8" />
          <path d="M5 10v10h14V10" /></svg
        >Home</a
      >
      <a href="products.html" class="active"
        ><svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" /></svg
        >Categories</a
      >
      <a href="cart.html"
        ><svg viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path
            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
          /></svg
        >Cart</a
      >
      <a href="orders.html"
        ><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18" /></svg
        >Orders</a
      >
      <a href="login.html"
        ><svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6" /></svg
        >Account</a
      >
    </nav>

    <div class="closed-overlay-full" id="closedOverlay">
      <div class="closed-box">
        <div class="ic">🌙</div>
        <h3>Store Closed</h3>
        <p id="closedCustomMsg">
          We are currently closed. Please visit again tomorrow! 🙏
        </p>
        <p class="text-muted" style="font-size: 12.5px">
          ⏰ Open: 7:00 AM – 10:00 PM
        </p>
        <button
          class="btn btn-ghost mt-16"
          onclick="
            window._closedDismissed = true;
            document.getElementById('closedOverlay').classList.remove('show');
          "
        >
          Browse Products 👀
        </button>
      </div>
    </div>

    <script src="js/firebase.js"></script>
    <script src="js/core.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const state = {
        cat: params.get("cat") || "",
        sub: params.get("sub") || "",
        q: (params.get("q") || "").toLowerCase(),
      };

      document.addEventListener("sqm:data-ready", render);
      document.addEventListener("DOMContentLoaded", () => {
        if (window.categories && window.categories.length) render();
      });

      function catFilterHTML() {
        return (
          `<label class="filter-row ${!state.cat ? "active-cat" : ""}" style="cursor:pointer;font-weight:700;" onclick="location.href='products.html'">🏪 All Items</label>` +
          (window.categories || [])
            .map(
              (c) =>
                `<label class="filter-row ${state.cat === c.id ? "active-cat" : ""}" style="cursor:pointer;" onclick="location.href='products.html?cat=${c.id}'">${c.emoji} ${c.label}</label>`,
            )
            .join("")
        );
      }

      function render() {
        document.getElementById("catFilters").innerHTML = catFilterHTML();
        document.getElementById("mobileFilterHost").innerHTML = catFilterHTML();
        document.getElementById("navRow").innerHTML =
          (window.categories || [])
            .map(
              (c) =>
                `<a href="products.html?cat=${c.id}" class="${state.cat === c.id ? "active" : ""}">${c.label}</a>`,
            )
            .join("") +
          `<a href="yourneed.html">YourNeed</a><a href="orders.html">Track Order</a>`;

        // subcategory pills (only when a specific category chosen)
        const pillsEl = document.getElementById("subcatPills");
        if (state.cat && window.catInfo[state.cat]) {
          const subs = (window.catInfo[state.cat].subs || []).filter((s) =>
            (window.products || []).some(
              (p) => p.cat === state.cat && p.sub === s,
            ),
          );
          if (subs.length > 1) {
            pillsEl.style.display = "flex";
            pillsEl.innerHTML =
              `<button class="subcat-pill ${!state.sub ? "active" : ""}" onclick="setSub('')">All</button>` +
              subs
                .map(
                  (s) =>
                    `<button class="subcat-pill ${state.sub === s ? "active" : ""}" onclick="setSub('${s.replace(/'/g, "\\'")}')">${s}</button>`,
                )
                .join("");
          } else pillsEl.style.display = "none";
        } else pillsEl.style.display = "none";

        renderGrid();
      }

      function setSub(sub) {
        state.sub = sub;
        render();
      }

      function renderGrid() {
        let list = (window.products || []).filter((p) => p.visible !== false);
        if (state.cat) list = list.filter((p) => p.cat === state.cat);
        if (state.sub) list = list.filter((p) => p.sub === state.sub);
        if (state.q)
          list = list.filter((p) =>
            (p.name || "").toLowerCase().includes(state.q),
          );
        sqmRenderProductGrid(document.getElementById("productGrid"), list);
      }

      document.getElementById("searchInput").addEventListener("input", (e) => {
        state.q = e.target.value.toLowerCase();
        renderGrid();
      });

      const fab = document.getElementById("filterFab");
      const overlay = document.getElementById("filterOverlay");
      const drawer = document.getElementById("filterDrawer");
      fab.addEventListener("click", () => {
        overlay.classList.add("open");
        requestAnimationFrame(() => (drawer.style.transform = "translateY(0)"));
      });
      function closeSheet() {
        drawer.style.transform = "translateY(100%)";
        setTimeout(() => overlay.classList.remove("open"), 280);
      }
      document
        .getElementById("closeFilter")
        .addEventListener("click", closeSheet);
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeSheet();
      });

      window.sqmApplyStoreStatus = sqmApplyStoreStatus;
    </script>
  </body>
</html>
